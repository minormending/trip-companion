# Daily Wanderlog sync.
#
# This runs in YOUR repository and pushes into YOUR Supabase project. It no
# longer holds a Wanderlog credential at all: the trip document route serves a
# trip to whoever has its key, so the key *is* the authorisation and there is
# no cookie to store, rotate or leak.
#
# Use a trip's **view key** — the one under Share, not the one in the address
# bar while editing. It carries the same itinerary and cannot change the trip,
# so the worst a leaked secret here can do is let somebody read a holiday.
#
# Required secrets:
#   WANDERLOG_TRIP_KEYS     space-separated view keys to sync
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_REFRESH_TOKEN  from "Copy sync token" in the web app
name: Sync Wanderlog

# The schedule is off until the secrets above exist. Right now this repository
# has only PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_ANON_KEY, which belong to
# the deploy, so a cron would do nothing but mail a failure every morning.
#
# Restore the cron in the same commit that adds them. workflow_dispatch stays,
# so the path can be exercised by hand first.
on:
  # schedule:
  #   - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Sync each trip
        env:
          # Read as a variable rather than interpolated into the script below.
          # `${{ }}` substitution happens before the shell sees the line, so a
          # secret containing shell metacharacters would run as code.
          TRIP_KEYS: ${{ secrets.WANDERLOG_TRIP_KEYS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_REFRESH_TOKEN: ${{ secrets.SUPABASE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TRIP_KEYS:-}" ]; then
            echo "WANDERLOG_TRIP_KEYS is empty — nothing to sync." >&2
            exit 1
          fi
          for key in $TRIP_KEYS; do
            echo "::group::$key"
            node scripts/sync-wanderlog.ts "$key"
            echo "::endgroup::"
          done
