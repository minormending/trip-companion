# Daily Wanderlog sync.
#
# This runs in YOUR repository, so the Wanderlog session sits in YOUR secrets
# and never reaches the Trip Companion database. That is the whole point of the
# arrangement: we hold trip data, you hold the credential.
#
# Required secrets:
#   WANDERLOG_SESSION       the connect.sid value (see wanderlog-cli docs/AUTH.md)
#   WANDERLOG_TRIP_KEYS     space-separated trip keys to sync
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_REFRESH_TOKEN  from "Copy sync token" in the web app
name: Sync Wanderlog

# The schedule is off until this workflow can actually complete. Two things
# have to be true first, and neither is today:
#
#   1. `go install .../cmd/wlog@latest` below resolves. The module has no
#      cmd/wlog package, so the install step fails before anything else runs.
#      See docs/WANDERLOG.md — fetching /api/tripPlans directly would remove
#      this dependency rather than wait on it.
#   2. The five secrets listed above exist. Only PUBLIC_SUPABASE_URL and
#      PUBLIC_SUPABASE_ANON_KEY are set, and those are the deploy's, not these.
#
# Left as workflow_dispatch so it can still be run by hand when testing a fix.
# Restore the cron in the same commit that makes both true.
on:
  # schedule:
  #   - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: npm ci
      - name: Install wlog
        run: go install github.com/KRamdath/wanderlog-cli/cmd/wlog@latest
      - name: Sync each trip
        env:
          # wlog reads this instead of touching disk, which is what its docs
          # recommend for CI and sandboxed agents.
          WANDERLOG_SESSION: ${{ secrets.WANDERLOG_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_REFRESH_TOKEN: ${{ secrets.SUPABASE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for key in ${{ secrets.WANDERLOG_TRIP_KEYS }}; do
            echo "::group::$key"
            node scripts/sync-wanderlog.ts "$key"
            echo "::endgroup::"
          done
